name: Release Tauri Applications

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_PATH: packages/bilibili-live-tool
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate signing inputs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          test -n "$TAURI_SIGNING_PUBLIC_KEY"

      - name: Validate release tag and project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=$(node -p "require('./${APP_PATH}/src-tauri/tauri.conf.json').version")
          test "${GITHUB_REF_NAME}" = "v${VERSION}"

      - name: Test release contracts
        run: pnpm --dir "$APP_PATH" test:release

      - name: Validate workflow formatting
        run: pnpm --dir "$APP_PATH" exec prettier --check ../../.github/workflows/release-tauri.yml

  prepare:
    needs: verify
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create channel draft releases
        shell: bash
        run: |
          VERSION=$(node -p "require('./${APP_PATH}/src-tauri/tauri.conf.json').version")
          for CHANNEL in free; do
            TAG="$CHANNEL-v$VERSION"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --draft \
                --title "liver $CHANNEL v$VERSION" \
                --notes "liver v$VERSION for Windows x64, macOS Apple Silicon, and macOS Intel."
            fi
          done

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        channel: [free]
        target:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
            asset_platform: macOS_AppleSilicon
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_targets: x86_64-apple-darwin
            asset_platform: macOS_Intel
          - platform: windows-latest
            args: --bundles nsis
            rust_targets: ""
            asset_platform: Windows_x64-setup
    runs-on: ${{ matrix.target.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.rust_targets }}

      - name: Configure macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"
          echo "CMAKE_OSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.APP_PATH }}/src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate signed updater configuration
        shell: bash
        env:
          TAURI_SIGNING_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
        run: >-
          node "$APP_PATH/scripts/prepare-release-config.mjs"
          --channel "${{ matrix.channel }}"
          --output "$APP_PATH/src-tauri/tauri.release.${{ matrix.channel }}.conf.json"

      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: "-"
          # 哔哩哔哩开放平台凭据 are injected at build time and never committed.
          BILI_OPEN_APP_ID: ${{ secrets.BILI_OPEN_APP_ID }}
          BILI_OPEN_ACCESS_KEY_ID: ${{ secrets.BILI_OPEN_ACCESS_KEY_ID }}
          BILI_OPEN_ACCESS_KEY_SECRET: ${{ secrets.BILI_OPEN_ACCESS_KEY_SECRET }}
        with:
          projectPath: ${{ env.APP_PATH }}
          tagName: ${{ matrix.channel }}-v__VERSION__
          releaseName: "liver ${{ matrix.channel }} v__VERSION__"
          releaseBody: "liver v__VERSION__ for Windows x64, macOS Apple Silicon, and macOS Intel."
          releaseDraft: true
          prerelease: false
          releaseAssetNamePattern: liver_[version]_${{ matrix.target.asset_platform }}[ext]
          args: --config src-tauri/tauri.release.${{ matrix.channel }}.conf.json ${{ matrix.target.args }}

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Resolve and verify official runtime packages
        run: >-
          node "$APP_PATH/scripts/resolve-runtime-artifacts.mjs"
          --output "$APP_PATH/.release-staging/runtime-artifacts.json"
          --download-dir "$APP_PATH/.release-staging/runtime-assets"

      - name: Validate optional WASM signature files
        shell: bash
        run: |
          shopt -s nullglob
          for module in release-assets/wasm/*.wasm; do
            test -s "${module}.sig"
          done

      - name: Download and finalize updater manifests
        shell: bash
        run: |
          VERSION=$(node -p "require('./${APP_PATH}/src-tauri/tauri.conf.json').version")
          for CHANNEL in free; do
            mkdir -p "$APP_PATH/.release-staging/$CHANNEL"
            gh release download "$CHANNEL-v$VERSION" --pattern latest.json --dir "$APP_PATH/.release-staging/$CHANNEL"
            gh release view "$CHANNEL-v$VERSION" \
              --json tagName,assets \
              > "$APP_PATH/.release-staging/$CHANNEL/release.json"
            node "$APP_PATH/scripts/finalize-update-manifest.mjs" \
              --input "$APP_PATH/.release-staging/$CHANNEL/latest.json" \
              --version "$VERSION" \
              --assets "$APP_PATH/.release-staging/$CHANNEL/release.json"
          done

      - name: Upload runtime catalog and optional WASM assets
        shell: bash
        run: |
          VERSION=$(node -p "require('./${APP_PATH}/src-tauri/tauri.conf.json').version")
          shopt -s nullglob
          WASM_ASSETS=(release-assets/wasm/*.wasm release-assets/wasm/*.wasm.sig)
          for CHANNEL in free; do
            gh release upload "$CHANNEL-v$VERSION" "$APP_PATH/.release-staging/runtime-artifacts.json#runtime-artifacts.json" --clobber
            if (( ${#WASM_ASSETS[@]} )); then
              gh release upload "$CHANNEL-v$VERSION" "${WASM_ASSETS[@]}" --clobber
            fi
          done

      - name: Publish channel manifests to main
        shell: bash
        run: |
          # The updater reads https://raw.githubusercontent.com/<repo>/main/<channel>/latest.json,
          # so the manifest lives on the default branch and no extra branch is needed.
          VERSION=$(node -p "require('./${APP_PATH}/src-tauri/tauri.conf.json').version")
          for CHANNEL in free; do
            TARGET="$CHANNEL/latest.json"
            FILE="$APP_PATH/.release-staging/$CHANNEL/latest.json"
            CONTENT=$(base64 -w0 "$FILE")
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/$TARGET" --jq .sha 2>/dev/null || true)
            if [[ -n "$SHA" ]]; then
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" \
                -f message="release: publish $CHANNEL updater manifest v$VERSION" \
                -f content="$CONTENT" \
                -f branch=main \
                -f sha="$SHA"
            else
              gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$TARGET" \
                -f message="release: publish $CHANNEL updater manifest v$VERSION" \
                -f content="$CONTENT" \
                -f branch=main
            fi
          done

      - name: Publish GitHub releases
        shell: bash
        run: |
          VERSION=$(node -p "require('./${APP_PATH}/src-tauri/tauri.conf.json').version")
          node "$APP_PATH/scripts/generate-release-notes.mjs" \
            --version "$VERSION" \
            --tag "free-v$VERSION" \
            --changes-file "$APP_PATH/release-notes/$VERSION.md" \
            --output "$APP_PATH/.release-staging/free/release-notes.md"
          gh release edit "free-v$VERSION" \
            --notes-file "$APP_PATH/.release-staging/free/release-notes.md" \
            --draft=false
